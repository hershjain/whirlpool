# Rename `app` to whatever `fly apps create` gave you. Note that the .fly.dev
# hostname is not PUBLIC_BASE_URL - the custom domain is - and that it has to
# be a bare origin, no path and no trailing slash, because Twilio signature
# validation compares it by exact string.
app = "whirlpool"
# ewr is Fly's New York-area region (Secaucus, NJ) - there is no nyc code.
# Kept on the east coast deliberately: Neon is in AWS us-east-2 (Ohio), and
# every query is a round trip to it - several in sequence on the webhook path,
# which fetches a page and then calls a model twice. The old sjc value put the
# whole country between them, ~70ms per query. Change this only alongside the
# Neon region, not on its own.
primary_region = "ewr"

[build]

[deploy]
  # Runs inside the built image, before the new version takes traffic. This is
  # why `prisma` is a runtime dependency rather than a dev one. `migrate deploy`
  # is the production command: it applies pending migrations and nothing else.
  # `migrate dev`, which the old README suggested, can prompt and can reset the
  # database.
  #
  # DATABASE_URL is swapped for DIRECT_URL here because they are different
  # endpoints on Neon: the app runs through the pooler (PgBouncer in
  # transaction mode), which does not carry the session state migrations need -
  # the advisory lock that stops two deploys migrating at once, and DDL that
  # wants a stable session. Migrating through the pooler fails intermittently,
  # which is the worst way for it to fail.
  #
  # Done here rather than as `directUrl` in schema.prisma on purpose: that
  # field makes DIRECT_URL required by `prisma generate`, which runs during the
  # Docker build, where Fly secrets do not exist. The build would break.
  #
  # Falls back to DATABASE_URL when DIRECT_URL is unset, so a plain Postgres
  # with no pooler in front of it needs no second secret.
  release_command = "sh -c 'export DATABASE_URL=\"${DIRECT_URL:-$DATABASE_URL}\"; npx prisma migrate deploy'"

[env]
  PORT = "3000"
  # Belt and braces with the Dockerfile's ENV. Set here too so that anyone
  # reading fly.toml can see what the app runs as without opening the image.
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true

  # Never scale to zero. This app is a webhook receiver: Twilio waits about 15
  # seconds and then retries, and a cold start inside that window turns one text
  # into two delivery attempts. The dedupe guard catches that, but the first
  # message would still be slow enough to feel broken.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    # /healthz runs SELECT 1 through Prisma rather than just answering 200, so a
    # machine with a dead database fails the check instead of quietly serving
    # errors. grace_period covers the release command plus boot.
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  # Enough for one Node process doing JSDOM parsing on fetched pages. The 2MB
  # response cap in safeFetch is what keeps that bounded; without it this size
  # would be the thing that runs out first.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
